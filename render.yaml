# ==============================================================================
# ⛵ Paperboat Education ERP Platform - Render Blueprint
# 1-Click Infrastructure Deployment on Render (render.com)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. BACKEND API SERVICE (Express.js + Prisma + Redis Cache)
  # ----------------------------------------------------------------------------
  - type: web
    name: paperboat-backend
    env: node
    region: oregon
    plan: starter
    rootDir: apps/backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: paperboat-postgres
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: paperboat-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SUPER_ADMIN_DEFAULT_EMAIL
        value: examforge.superadmin@gmail.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_ADMIN_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 2. FRONTEND WEB APPLICATION (Next.js 14)
  # ----------------------------------------------------------------------------
  - type: web
    name: paperboat-frontend
    env: node
    region: oregon
    plan: starter
    rootDir: apps/frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: paperboat-backend
          property: host
          value: https://paperboat-backend.onrender.com

# ------------------------------------------------------------------------------
# DATABASES & IN-MEMORY CACHE
# ------------------------------------------------------------------------------
databases:
  # Managed PostgreSQL 16 Database
  - name: paperboat-postgres
    region: oregon
    plan: free
    databaseName: exam_forge
    user: postgres

redis:
  # Managed Redis Cache & Queue Store
  - name: paperboat-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
